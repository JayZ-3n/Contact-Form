<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="form-container">
        <header class="form-header">
            <h1>Contact Form</h1>
            <p>Please fill all the texts in the fields.</p>
        </header>

        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Your Name :</label>
                <input type="text" id="name" name="name" placeholder="Your Full Name" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email :</label>
                <input type="email" id="email" name="email" placeholder="Valid Email Address" required>
            </div>

            <div class="form-group align-top">
                <label for="message">Message :</label>
                <textarea id="message" name="message" rows="5" placeholder="Your Message to Us" required></textarea>
            </div>

            <div class="form-group">
                <label for="subject">Subject :</label>
                <select id="subject" name="subject" required>
                    <option value="job-inquiry">Job Inquiry</option>
                    <option value="general-question">General Question</option>
                </select>
            </div>

            <div class="form-group button-group">
                <button type="submit" class="btn-send">Send</button>
            </div>
        </form>
    </main>

</body>
</html>
